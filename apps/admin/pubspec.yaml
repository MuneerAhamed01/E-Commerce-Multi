name: admin
resolution: workspace
description: >
  Admin Panel Flutter app (web-first, responsive to tablet/desktop) for the
  White Label Commerce Platform. Thin app shell only - business logic and
  UI live in packages/features/* (see docs/02_PROJECT_STRUCTURE.md §3).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # core, design_system, go_router, get_it/injectable, and every consumed
  # admin feature package: wired starting Phase 2
  # (see docs/03_DEVELOPMENT_PHASES.md).

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
