name: admin
resolution: workspace
description: >
  Admin Panel Flutter app (web-first, responsive to tablet/desktop) for the
  White Label Commerce Platform. Thin app shell only - business logic and
  UI live in packages/features/* (see docs/02_PROJECT_STRUCTURE.md §3).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  authentication: ^0.1.0
  core: ^0.1.0
  design_system: ^0.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  # Additional admin feature packages: wired starting Phase 21+
  # (see docs/03_DEVELOPMENT_PHASES.md).

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true
  assets:
    # `assets/tenants` is a symlink to the canonical `config/tenants/` at
    # the repo root (Flutter does not reliably bundle assets declared with
    # a `../` path, so the in-app-root symlink is the single source of
    # truth without duplicating the JSON files) - see
    # docs/11_ENVIRONMENT_CONFIGURATION.md §6.
    # A tenant-management upload feature (Phase 26) replaces this with a
    # remote-config-backed source without changing the loader's shape.
    - assets/tenants/
