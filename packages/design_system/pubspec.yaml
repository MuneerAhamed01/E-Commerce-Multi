name: design_system
resolution: workspace
description: >
  Design tokens, theming, and the shared reusable component library for the
  White Label Commerce Platform. Consumed by both apps/storefront and
  apps/admin. Depends only on the core package
  (see docs/02_PROJECT_STRUCTURE.md §5).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  core: ^0.1.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
