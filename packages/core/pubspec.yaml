name: core
resolution: workspace
description: >
  Cross-cutting infrastructure for the White Label Commerce Platform:
  error handling, use case contracts, dependency injection bootstrap,
  logging, configuration, and shared utilities. Pure Dart - no Flutter
  dependency, and no dependency on any feature package or app
  (see docs/02_PROJECT_STRUCTURE.md §4 and §12).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  equatable: ^2.1.0 # value equality for Failure/Result-adjacent value types
  get_it: ^9.2.1 # service locator
  injectable: ^3.0.0 # annotation-driven DI registration
  intl: ^0.20.3 # currency/date/number formatting

dev_dependencies:
  build_runner: ^2.16.1
  injectable_generator: ^3.0.2
  test: ^1.25.6
